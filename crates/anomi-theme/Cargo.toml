[package]
name = "anomi-theme"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "GPL-3.0-or-later"
description = "The iced interface's design system: the twelve palettes, sizes, type, motion, and the theme every widget styles itself from"

[lib]
doctest = false

[dependencies]
iced.workspace = true
# Twemoji and the name faces, which fonts.rs lists with DM Sans (F03).
anomi-fonts.workspace = true
serde.workspace = true
serde_json.workspace = true
yapfast-lang = { path = "../yapfast-lang" }
# renderer::software: the fallback renderer's processor side, which iced
# builds anyway, made on its own for shots, tests and a faded name.
iced_tiny_skia.workspace = true

[dev-dependencies]
# Draws one of each widget headless in the catalog test.
iced_test.workspace = true
